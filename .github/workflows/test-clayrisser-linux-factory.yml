run-name: Test action ver. @${{ inputs.branch }} on clayrisser's linux factory

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Linux Factory target test branch"
        required: false
        default: "v2"
  workflow_call: 
    inputs:
      branch:
        description: "Linux Factory target test branch"
        required: false
        type: string
        default: "v2"

env:
  LB_CACHE: "true"
  LB_CACHE_STAGES: "bootstrap chroot"
  LB_CACHE_PACKAGES: "true"

jobs:
  build:
    runs-on: ubuntu-24.04 # This version should be compatiable with Clayrisser Linux Factory
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v2
        with:
          remove-android: 'true'
          remove-codeql: 'true'

      - uses: actions/checkout@v5
        with:
          repository: 'clayrisser/linux-factory'
          path: linux-factory
          lfs: true

      - name: Cleanup and check broken example overlays
        run: | 
          rm -r $GITHUB_WORKSPACE/linux-factory/overlays/example
          ls $GITHUB_WORKSPACE/linux-factory/overlays

      - name: Force enable live-build cache
        run: |
          set -euo pipefail

          CONF="debian-livecd/lb/auto/config"

          sudo sed -i \
            -e 's/--cache "\${CACHE:-true}"/--cache "true"/' \
            -e '/--cache "true"/a\    --cache-stages "bootstrap chroot" \\' \
            -e '/--cache-stages "bootstrap chroot"/a\    --cache-packages "true" \\' \
            "$CONF"

          sudo mkdir -p /etc/live
          cat <<'EOF' | sudo tee /etc/live/build.conf > /dev/null
          LB_CACHE="true"
          LB_CACHE_STAGES="bootstrap chroot"
          LB_CACHE_PACKAGES="true"
          EOF

      - name: Build Linux Factory
        uses: jenseng/dynamic-uses@v1
        id: linux-factory
        with:
          uses: cnshing/build-linux-factory@${{ inputs.branch }}
          with: |
            path: linux-factory
  
      - uses: actions/upload-artifact@v4
        with:
          name: clayrisser-iso
          path: ${{ fromJSON(steps.linux-factory.outputs.outputs).iso }}
      
