name: "build-linux-factory"
description: "Builds an image from a linux factory"
branding:
  icon: "monitor"
  color: "orange"

inputs:
  path:
    description: "Path of the linux factory under $GITHUB_WORKSPACE. If no path is supplied, $GITHUB_WORKSPACE will act as the working build directory."
    required: false
outputs:
  iso:
    description: "The full file path of the image build."
    value: ${{ steps.iso-path.outputs.iso }}

runs:
  using: "composite"
  steps:
    - name: Update dependencies
      shell: bash
      run: sudo apt-get update

    # These dependencies are not cacheable/error prone from caching
    - name: Install non-cacheable dependencies
      shell: bash
      run: |
        sudo apt-get install -y \
                imagemagick \
                debian-archive-keyring

    - name: Install cacheable dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: make git git-lfs grub-emu python3 python3-pip jq virtualenv yq sudo
        execute_install_scripts: true

    # Live-build from ubuntu repositories have different configuration CLI options.
    - name: Install live-build from Debian stable
      shell: bash
      run: |
        url="$(
          docker run --rm debian:stable bash -lc '
            set -euo pipefail
            apt-get update >/dev/null
            apt-get install --reinstall --print-uris -qq live-build \
              | awk -F"'"'"'" "/\/live-build_.*\.deb/ { print \$2; exit }"
          '
        )"
        echo "Resolved URL: $url"
        wget -O /tmp/live-build.deb "$url"
        sudo dpkg -i /tmp/live-build.deb || sudo apt-get install -f -y

    # Setup Poetry from `https://github.com/snok/install-poetry?tab=readme-ov-file#testing`
    - name: Save Python version
      id: python
      shell: bash
      run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        virtualenvs-path: .venv
        installer-parallel: true
        plugins: | # Required for Linux Factory
          poetry-plugin-export

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: ./${{ inputs.path }}/.venv
        key: venv-${{ runner.os }}-${{ steps.python.outputs.version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.path)) }}

    - name: Install dependencies
      working-directory: ./${{ inputs.path }}
      shell: bash
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Activate virtualenv # From https://stackoverflow.com/a/74669486
      working-directory: ./${{ inputs.path }}
      shell: bash
      run: |
        . .venv/bin/activate
        echo PATH=$PATH >> $GITHUB_ENV

    # Cache downloaded .deb files (bootstrap/chroot/binary apt runs).
    - name: Restore cached live-build packages
      id: cache-lb-debs
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.path }}/.build/lb/cache/packages.bootstrap
          ${{ inputs.path }}/.build/lb/cache/packages.chroot
          ${{ inputs.path }}/.build/lb/cache/packages.binary
        key: lb-debs-${{ runner.os }}-${{ hashFiles(format('{0}/overlays/**', inputs.path)) }}
        restore-keys: |
          lb-debs-${{ runner.os }}-

    # Allow caching of whole-directory chroot snapshots (LB_CACHE_STAGES). live-build's restore is
    # content-blind (plain cp -a, no invalidation check), so no restore-keys
    # an exact-match miss just means a normal build, a fuzzy hit would silently
    # skip real work with stale content.
    - name: Restore cached bootstrap stage
      id: cache-lb-bootstrap
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}/.build/lb/cache/bootstrap
        key: lb-bootstrap-${{ runner.os }}-${{ hashFiles(format('{0}/os/config.yaml', inputs.path)) }}

    - name: Restore cached chroot stage
      id: cache-lb-chroot
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}/.build/lb/cache/chroot
        key: lb-chroot-${{ runner.os }}-${{ hashFiles(format('{0}/os/config.yaml', inputs.path), format('{0}/overlays/**', inputs.path)) }}

    - name: Live Build
      working-directory: ./${{ inputs.path }}
      shell: bash
      run: sudo env "PATH=$PATH" make build

    - name: Enable execute and read for cache files # Allows unprivielged cache action to save files
      shell: bash
      run: sudo chmod -R a+rX ${{ inputs.path }}/.build/lb/cache

    - name: Save live-build packages cache
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.path }}/.build/lb/cache/packages.bootstrap
          ${{ inputs.path }}/.build/lb/cache/packages.chroot
          ${{ inputs.path }}/.build/lb/cache/packages.binary
        key: ${{ steps.cache-lb-debs.outputs.cache-primary-key }}

    - name: Save bootstrap stage cache
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path }}/.build/lb/cache/bootstrap
        key: ${{ steps.cache-lb-bootstrap.outputs.cache-primary-key }}

    - name: Save chroot stage cache
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path }}/.build/lb/cache/chroot
        key: ${{ steps.cache-lb-chroot.outputs.cache-primary-key }}

    # - name: Recursively list all directories # Temporary command to list all possible files
    #   working-directory: .
    #   shell: bash
    #   run: |
    #     sudo apt-get install -y tree
    #     tree -a

    - name: Output ISO Path
      id: iso-path
      shell: bash
      run: |
        base="${{ inputs.path }}/.build/lb"
        file=$(find "$(pwd)/$base" -maxdepth 1 -type f -name "*.iso" | head -n 1)
        echo "iso=$file" >> "$GITHUB_OUTPUT"
